	# BEGIN CCD Portal managed Desk entry redirects. Keep these relative so the
	# external HTTPS scheme and host are preserved behind the reverse proxy.
	location = / {
		# Frappe website RPCs, including Web Form saves, POST to the site root.
		# Preserve the request method and body by internally routing non-page
		# requests to the existing backend named location.
		error_page 418 = @webserver;
		if ($request_method !~ ^(GET|HEAD)$) {
			return 418;
		}

		absolute_redirect off;
		return 302 /app/home;
	}

	location = /app {
		absolute_redirect off;
		return 302 /app/home;
	}

	location = /app/ {
		absolute_redirect off;
		return 302 /app/home;
	}
	# END CCD Portal managed Desk entry redirects.
