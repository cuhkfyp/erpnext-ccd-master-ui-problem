	# BEGIN CCD Portal managed Desk entry redirects. Keep these relative so the
	# external HTTPS scheme and host are preserved behind the reverse proxy.
	location = / {
		absolute_redirect off;
		return 302 /app/home;
	}

	location = /app {
		absolute_redirect off;
		return 302 /app/home;
	}

	location = /app/ {
		absolute_redirect off;
		return 302 /app/home;
	}
	# END CCD Portal managed Desk entry redirects.
